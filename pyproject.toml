[project]
name = "ott-retention-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "FliccThicc", email = "dhruvusaff@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "faker>=40.54.0",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "langchain-core>=1.8.0",
    "langgraph>=1.2.22",
    "lifelines>=0.30.0",
    "lightgbm>=4.7.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
    "shap>=0.51.0",
    "streamlit>=1.67.0",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ott-retention-agent = "ott_retention_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
